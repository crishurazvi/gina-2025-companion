<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GINA 2025 - Compagnon Clinique</title>
    <!-- Bootstrap pentru grid și switch-uri -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Fundal animat abstract -->
<div class="bg-animation"></div>

<div class="container my-5 position-relative z-index-1">
    <div class="text-center mb-5 header-text">
        <h1 class="fw-bold">Compagnon Clinique GINA</h1>
        <p class="lead opacity-75">Gestion de l'asthme pour adultes et adolescents (12+ ans) – Édition 2025</p>
    </div>

    <div class="row g-4">
        <!-- Formulaire de saisie (Panou Stânga) -->
        <div class="col-lg-6">
            <div class="glass-panel p-4 h-100">
                <h4 class="mb-4 fw-semibold section-title">Évaluation du patient</h4>
                <form id="asthmaForm">
                    
                    <!-- Traitement actuel -->
                    <div class="mb-4">
                        <label class="form-label fw-medium">1. Traitement Actuel (Étape GINA)</label>
                        <select id="currentStep" class="form-select glass-input mb-3">
                            <option value="0" style="color: black;">Aucun (Nouveau diagnostic)</option>
                            <option value="1" style="color: black;">Palier 1-2 (CSI-formotérol à la demande)</option>
                            <option value="3" style="color: black;">Palier 3 (MART faible dose / CSI-BALA)</option>
                            <option value="4" style="color: black;">Palier 4 (MART dose moyenne / CSI-BALA)</option>
                            <option value="5" style="color: black;">Palier 5 (Spécialiste / LAMA / Biologiques)</option>
                        </select>

                        <label class="form-label fw-medium">Voie de traitement (Track)</label>
                        <select id="currentTrack" class="form-select glass-input">
                            <option value="1" style="color: black;">Voie 1 (Privilégiée) : CSI-formotérol PRN</option>
                            <option value="2" style="color: black;">Voie 2 (Alternative) : BACA PRN</option>
                        </select>
                    </div>

                    <!-- Contrôle des symptômes (Toggles iOS style) -->
                    <div class="mb-4">
                        <label class="form-label fw-medium mb-3">2. Contrôle des symptômes (4 dernières semaines)</label>
                        
                        <div class="form-check form-switch custom-switch mb-3">
                            <input class="form-check-input symptom-check" type="checkbox" role="switch" id="sympDay">
                            <label class="form-check-label" for="sympDay">Symptômes diurnes > 2 fois/semaine</label>
                        </div>
                        <div class="form-check form-switch custom-switch mb-3">
                            <input class="form-check-input symptom-check" type="checkbox" role="switch" id="sympNight">
                            <label class="form-check-label" for="sympNight">Réveil nocturne dû à l'asthme</label>
                        </div>
                        <div class="form-check form-switch custom-switch mb-3">
                            <input class="form-check-input symptom-check" type="checkbox" role="switch" id="sympReliever">
                            <label class="form-check-label" for="sympReliever">Besoin de soulagement > 2 fois/semaine</label>
                        </div>
                        <div class="form-check form-switch custom-switch mb-3">
                            <input class="form-check-input symptom-check" type="checkbox" role="switch" id="sympActivity">
                            <label class="form-check-label" for="sympActivity">Limitation des activités due à l'asthme</label>
                        </div>
                    </div>

                    <!-- Stabilité -->
                    <div class="mb-4">
                        <label class="form-label fw-medium mb-3">3. Stabilité à long terme</label>
                        <div class="form-check form-switch custom-switch switch-success">
                            <input class="form-check-input" type="checkbox" role="switch" id="wellControlled3Months">
                            <label class="form-check-label" for="wellControlled3Months">Asthme bien contrôlé depuis ≥ 3 mois</label>
                        </div>
                    </div>

                    <button type="button" class="btn glass-btn w-100 mt-2 py-3 fw-bold" onclick="evaluateAsthma()">Générer la Recommandation</button>
                </form>
            </div>
        </div>

        <!-- Résultat de l'évaluation (Panou Dreapta) -->
        <div class="col-lg-6">
            <div class="glass-panel p-4 h-100 d-flex flex-column">
                <h4 class="mb-4 fw-semibold section-title">Plan Thérapeutique</h4>
                <div id="resultArea" class="flex-grow-1 d-flex flex-column justify-content-center">
                    <div class="text-center opacity-50">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-lungs mb-3" viewBox="0 0 16 16">
                          <path d="M8 1a.5.5 0 0 1 .5.5v5.243l1.136-1.02a.5.5 0 0 1 .665-.01l.034.028 4.223 3.518a.5.5 0 0 1 .168.48L13.5 13.56a.5.5 0 0 1-.497.44h-2a.5.5 0 0 1-.486-.381l-1.423-6.16-1.121 1.008A.5.5 0 0 1 8 8.5v5a.5.5 0 0 1-1 0v-5a.5.5 0 0 1 .027-.164l-1.121-1.008-1.423 6.16A.5.5 0 0 1 4 14h-2a.5.5 0 0 1-.497-.44L.274 9.74a.5.5 0 0 1 .168-.48l4.223-3.518.034-.029a.5.5 0 0 1 .665.01L6.5 6.743V1.5A.5.5 0 0 1 7 1h1z"/>
                        </svg>
                        <p class="lead">Les recommandations s'afficheront ici après l'évaluation du patient.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
